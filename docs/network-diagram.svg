<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#ffffff"/>
  <text x="50" y="55" font-family="Segoe UI,Arial" font-size="30" font-weight="700" fill="#17202a">NetTrace Support Lab — isolated architecture</text>
  <rect x="40" y="85" width="1320" height="650" rx="22" fill="#eaf2f8" stroke="#2874a6" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="65" y="120" font-family="Segoe UI,Arial" font-size="19" font-weight="700" fill="#1b4f72">MY COMPUTER / TRUST BOUNDARY</text>
  <rect x="90" y="175" width="270" height="125" rx="14" fill="#d6eaf8" stroke="#1b4f72" stroke-width="3"/>
  <text x="225" y="210" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#17202a">Windows Host</text>
  <text x="225" y="240" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#17202a">PowerShell • Git • Wireshark</text>
  <text x="225" y="267" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#17202a">commands and screenshots</text>
  <rect x="430" y="135" width="410" height="330" rx="20" fill="#e8f8f5" stroke="#148f77" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="455" y="170" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#117a65">WSL2 TRUST BOUNDARY</text>
  <text x="635" y="235" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="700" fill="#17202a">WSL2 Ubuntu</text>
  <text x="635" y="265" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#17202a">linux-baseline.sh • scenario harness</text>
  <text x="635" y="292" text-anchor="middle" font-family="Segoe UI,Arial" font-size="16" fill="#17202a">synthetic files only</text>
  <rect x="490" y="340" width="290" height="105" rx="14" fill="#fcf3cf" stroke="#b7950b" stroke-width="3"/>
  <text x="635" y="372" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#17202a">Local test service</text>
  <text x="635" y="399" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#17202a">127.0.0.1 • HTTP / HTTPS / DNS</text>
  <text x="635" y="425" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#17202a">started and stopped per test</text>
  <rect x="925" y="175" width="355" height="245" rx="20" fill="#f9ebea" stroke="#922b21" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="950" y="210" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#922b21">EXTERNAL / UNTRUSTED</text>
  <rect x="975" y="260" width="255" height="115" rx="14" fill="#f5b7b1" stroke="#922b21" stroke-width="3"/>
  <text x="1102" y="292" text-anchor="middle" font-family="Segoe UI,Arial" font-size="18" font-weight="700" fill="#17202a">Internet destination</text>
  <text x="1102" y="320" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#17202a">example.com / 1.1.1.1</text>
  <text x="1102" y="347" text-anchor="middle" font-family="Segoe UI,Arial" font-size="15" fill="#17202a">opt-in reference only</text>
  <path d="M360 237 H430" stroke="#2874a6" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="395" y="225" text-anchor="middle" font-family="Segoe UI,Arial" font-size="14" fill="#2874a6">local commands</text>
  <path d="M635 300 V340" stroke="#b7950b" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowGold)"/>
  <text x="655" y="325" font-family="Segoe UI,Arial" font-size="14" fill="#8a6d00">loopback only</text>
  <path d="M360 280 C570 500 780 520 975 320" fill="none" stroke="#922b21" stroke-width="4" stroke-dasharray="9 7" marker-end="url(#arrowRed)"/>
  <text x="760" y="535" font-family="Segoe UI,Arial" font-size="14" fill="#922b21">not captured; skipped by default</text>
  <rect x="90" y="555" width="1190" height="125" rx="14" fill="#ffffff" stroke="#5d6d7e" stroke-width="3"/>
  <text x="115" y="590" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#17202a">Capture boundary:</text>
  <text x="285" y="590" font-family="Segoe UI,Arial" font-size="17" fill="#17202a">Wireshark/TShark captures only loopback traffic generated by the local harness.</text>
  <text x="115" y="620" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#17202a">Isolation:</text>
  <text x="215" y="620" font-family="Segoe UI,Arial" font-size="17" fill="#17202a">no physical adapter, router, employer network, or public scan.</text>
  <text x="115" y="650" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#17202a">Evidence:</text>
  <text x="205" y="650" font-family="Segoe UI,Arial" font-size="17" fill="#17202a">raw reports stay ignored; sanitized summaries and screenshots are committed.</text>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2874a6"/></marker>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b7950b"/></marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#922b21"/></marker>
  </defs>
</svg>
